<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ゲーム(一時停止) - 数独パズル</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">@layer base { *, ::after, ::before, ::backdrop, ::file-selector-button { border-color: var(--color-gray-200, currentColor); } }</style>
    <script src="mock.js"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script>
      const root = document.getElementById("root");
      renderPlay(root, { hidden: true, disabled: true, pauseLabel: "再開" });
      root.querySelector("#overlay").innerHTML = `
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-white/90">
          <p class="text-lg font-bold">一時停止中</p>
          <button class="h-11 rounded-lg bg-blue-700 px-6 text-sm font-medium text-white">再開</button>
        </div>`;
    </script>
  </body>
</html>
